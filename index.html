<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Libreta Moderna v1.3.2</title>
    
    <!-- Configuración PWA / App Instalable -->
    <meta name="theme-color" content="#18181b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Libreta">
    
    <link rel="manifest" id="manifestPlaceholder">

    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #121214;
            --bg-sidebar: #18181b;
            --bg-card: #27272a;
            --border-color: #3f3f46;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --paper-bg: #1c1c20;
            --paper-line: rgba(255, 255, 255, 0.05);
            
            /* Colores Visibles de Etiquetas */
            --tag-general: #71717a;
            --tag-personal: #3b82f6;
            --tag-trabajo: #f59e0b;
            --tag-ideas: #10b981;
            --tag-importante: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- CONTENEDOR PRINCIPAL NATIVO --- */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* --- BARRA LATERAL / PANTALLA DE LISTA --- */
        .sidebar {
            width: 340px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            user-select: none;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .brand svg {
            width: 24px;
            height: 24px;
            fill: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        .search-box {
            padding: 15px 20px 10px 20px;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 10px 12px 10px 35px;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .search-container i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* --- FILTROS POR ETIQUETA --- */
        .tag-filters {
            display: flex;
            gap: 6px;
            padding: 0 20px 15px 20px;
            overflow-x: auto;
        }

        .filter-chip {
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 12px;
            background-color: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-chip.active {
            border-color: var(--accent-color);
            color: var(--text-primary);
            background-color: rgba(139, 92, 246, 0.2);
        }

        .tag-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 20px 10px;
        }

        .note-item {
            padding: 14px 15px;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .note-item:hover {
            background-color: var(--bg-card);
        }

        .note-item.active {
            background-color: var(--bg-card);
            border-color: var(--accent-color);
        }

        .note-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 25px;
        }

        .note-item-title {
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-tag-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            color: #ffffff;
            text-transform: uppercase;
        }

        .note-item-preview {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .btn-delete {
            position: absolute;
            right: 12px;
            top: 14px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            opacity: 0.6;
            transition: color 0.2s;
        }

        .btn-delete:hover {
            color: #ef4444;
        }

        /* --- ÁREA DEL EDITOR --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--paper-bg);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .editor-header {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-sidebar);
        }

        .editor-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .editor-title {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            outline: none;
            width: 100%;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag-select {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }

        .editor-body {
            flex: 1;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
        }

        .editor-textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            resize: none;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-primary);
            outline: none;
            background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
            background-size: 100% 1.8rem;
        }

        .footer-stamp {
            position: absolute;
            bottom: 8px;
            right: 15px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
            font-family: monospace;
            pointer-events: none;
        }

        .lock-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--paper-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        .pin-input {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            color: var(--text-primary);
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 5px;
            width: 140px;
            outline: none;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 15px;
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--border-color);
        }

        #importFile { display: none; }

        @media (max-width: 768px) {
            .sidebar {
                width: 100vw;
                position: absolute;
                top: 0; left: 0; bottom: 0;
            }

            .main-content {
                width: 100vw;
                position: absolute;
                top: 0; left: 0; bottom: 0;
                transform: translateX(100vw);
            }

            .app-container.mobile-editor-active .sidebar {
                transform: translateX(-100vw);
            }

            .app-container.mobile-editor-active .main-content {
                transform: translateX(0);
            }

            .btn-back {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- PANTALLA 1: LISTA -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <svg viewBox="0 0 24 24"><path d="M19,2L5,2C3.89,2 3,2.89 3,4L3,20C3,21.1 3.89,22 5,22L19,22C20.1,22 21,21.1 21,20L21,4C21,2.89 20.1,2 19,2ZM19,20L5,20L5,4L7,4L7,10L9.5,8.5L12,10L12,4L19,4L19,20Z"/></svg>
                    <span>Mi Libreta</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" id="importBtn" title="Restaurar Copia JSON"><i class="fa-solid fa-file-import"></i></button>
                    <button class="btn-icon" id="exportAllBtn" title="Copia de Seguridad JSON"><i class="fa-solid fa-file-export"></i></button>
                    <button class="btn-icon" id="newNoteBtn" title="Nueva Nota"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <div class="search-box">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar apuntes...">
                </div>
            </div>

            <div class="tag-filters" id="tagFilters">
                <span class="filter-chip active" data-tag="todas">Todas</span>
                <span class="filter-chip" data-tag="personal"><span class="tag-dot" style="background: var(--tag-personal);"></span>Personal</span>
                <span class="filter-chip" data-tag="trabajo"><span class="tag-dot" style="background: var(--tag-trabajo);"></span>Trabajo</span>
                <span class="filter-chip" data-tag="ideas"><span class="tag-dot" style="background: var(--tag-ideas);"></span>Ideas</span>
                <span class="filter-chip" data-tag="importante"><span class="tag-dot" style="background: var(--tag-importante);"></span>Importante</span>
            </div>

            <div class="notes-list" id="notesList"></div>
        </aside>

        <!-- PANTALLA 2: EDITOR -->
        <main class="main-content">
            <div id="editorContainer" style="display: flex; flex-direction: column; height: 100%;">
                <div class="editor-header">
                    <div class="editor-top-bar">
                        <button class="btn-back" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Notas</button>
                        <input type="text" id="noteTitle" class="editor-title" placeholder="Título...">
                    </div>
                    <div class="editor-toolbar">
                        <select id="noteTag" class="tag-select">
                            <option value="general">⚪ General</option>
                            <option value="personal">🔵 Personal</option>
                            <option value="trabajo">🟠 Trabajo</option>
                            <option value="ideas">🟢 Ideas</option>
                            <option value="importante">🔴 Importante</option>
                        </select>
                        <button class="btn-icon" id="addChecklistBtn" title="Añadir Lista de Tareas"><i class="fa-solid fa-square-check"></i></button>
                        <button class="btn-icon" id="lockNoteBtn" title="Proteger con PIN"><i class="fa-solid fa-lock"></i></button>
                        <button class="btn-icon" id="exportTxtBtn" title="Exportar a .TXT"><i class="fa-solid fa-download"></i></button>
                    </div>
                </div>

                <div class="editor-body">
                    <textarea id="noteContent" class="editor-textarea" placeholder="Empieza a escribir tus ideas aquí..."></textarea>
                </div>

                <div id="lockScreen" class="lock-screen" style="display: none;">
                    <i class="fa-solid fa-shield-halved" style="font-size: 2.5rem; color: var(--accent-color);"></i>
                    <p>Nota protegida con PIN</p>
                    <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
                    <button class="btn-icon" id="unlockBtn" style="width: auto; padding: 0 15px;"><i class="fa-solid fa-key"></i> Desbloquear</button>
                </div>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fa-regular fa-note-sticky"></i>
                <p>Selecciona una nota para empezar</p>
            </div>

            <input type="file" id="importFile" accept=".json">
            <span class="footer-stamp">medbasha</span>
        </main>
    </div>

    <script>
        // --- MANIFEST PWA Y SERVICE WORKER ESTÁNDAR ---
        const iconPNG = 'https://cdn-icons-png.flaticon.com/512/3209/3209265.png';

        const manifestData = {
            name: "Mi Libreta Moderna v1.3.2",
            short_name: "Libreta",
            start_url: "./",
            display: "standalone",
            background_color: "#121214",
            theme_color: "#18181b",
            icons: [
                { src: iconPNG, sizes: "192x192", type: "image/png" },
                { src: iconPNG, sizes: "512x512", type: "image/png" }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('manifestPlaceholder').setAttribute('href', URL.createObjectURL(manifestBlob));

        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'libreta-v1.3.2';
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                    e.waitUntil(caches.open(CACHE_NAME).then((c) => c.addAll(['./'])));
                });
                self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', (e) => e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request))));
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }

        // --- ESTADO Y LÓGICA DE APUNTES ---
        let notes = JSON.parse(localStorage.getItem('medbasha_notebook_notes')) || [];
        let activeNoteId = null;
        let selectedTagFilter = 'todas';

        const tagColors = {
            general: 'var(--tag-general)',
            personal: 'var(--tag-personal)',
            trabajo: 'var(--tag-trabajo)',
            ideas: 'var(--tag-ideas)',
            importante: 'var(--tag-importante)'
        };

        const appContainer = document.getElementById('appContainer');
        const notesList = document.getElementById('notesList');
        const noteTitle = document.getElementById('noteTitle');
        const noteContent = document.getElementById('noteContent');
        const noteTag = document.getElementById('noteTag');
        const newNoteBtn = document.getElementById('newNoteBtn');
        const searchInput = document.getElementById('searchInput');
        const editorContainer = document.getElementById('editorContainer');
        const emptyState = document.getElementById('emptyState');
        const lockScreen = document.getElementById('lockScreen');
        const pinInput = document.getElementById('pinInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const lockNoteBtn = document.getElementById('lockNoteBtn');
        const backBtn = document.getElementById('backBtn');

        function saveToStorage() {
            localStorage.setItem('medbasha_notebook_notes', JSON.stringify(notes));
        }

        function createNote() {
            const newNote = {
                id: Date.now().toString(),
                title: 'Nota sin título',
                content: '',
                tag: 'general',
                pin: null,
                updatedAt: new Date().toISOString()
            };

            notes.unshift(newNote);
            saveToStorage();
            activeNoteId = newNote.id;
            renderNotes();
            loadActiveNote();
            openEditorMobile();

            // Enfocar y seleccionar el título inmediatamente al pulsar el plus (+)
            setTimeout(() => {
                noteTitle.focus();
                noteTitle.select();
            }, 300);
        }

        function deleteNote(id, event) {
            event.stopPropagation();
            notes = notes.filter(n => n.id !== id);
            saveToStorage();

            if (activeNoteId === id) {
                activeNoteId = notes.length > 0 ? notes[0].id : null;
            }
            renderNotes();
            loadActiveNote();
        }

        function loadActiveNote() {
            const activeNote = notes.find(n => n.id === activeNoteId);

            if (activeNote) {
                editorContainer.style.display = 'flex';
                emptyState.style.display = 'none';

                if (activeNote.pin) {
                    lockScreen.style.display = 'flex';
                    pinInput.value = '';
                } else {
                    lockScreen.style.display = 'none';
                }

                noteTitle.value = activeNote.title;
                noteContent.value = activeNote.content;
                noteTag.value = activeNote.tag || 'general';
                lockNoteBtn.style.color = activeNote.pin ? 'var(--accent-color)' : 'var(--text-primary)';
            } else {
                editorContainer.style.display = 'none';
                emptyState.style.display = 'flex';
            }
        }

        function renderNotes() {
            notesList.innerHTML = '';
            const query = searchInput.value.toLowerCase();

            const filteredNotes = notes.filter(n => {
                const matchesSearch = n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query);
                const matchesTag = selectedTagFilter === 'todas' || n.tag === selectedTagFilter;
                return matchesSearch && matchesTag;
            });

            if (filteredNotes.length === 0) {
                notesList.innerHTML = `<div style="text-align: center; color: var(--text-secondary); margin-top: 20px; font-size: 0.85rem;">Sin apuntes</div>`;
                return;
            }

            filteredNotes.forEach(note => {
                const item = document.createElement('div');
                item.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
                
                const dateFormatted = new Date(note.updatedAt).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
                const preview = note.pin ? '🔒 Nota Protegida' : (note.content.trim() || 'Nota vacía...');
                const tagName = note.tag || 'general';

                item.innerHTML = `
                    <div class="note-item-header">
                        <span class="note-item-title">${note.title || 'Nota sin título'}</span>
                        <span class="note-tag-badge" style="background-color: ${tagColors[tagName]};">${tagName}</span>
                    </div>
                    <div class="note-item-preview">${preview}</div>
                    <div class="note-item-footer">
                        <span>${dateFormatted}</span>
                        ${note.pin ? '<i class="fa-solid fa-lock" style="font-size:0.7rem;"></i>' : ''}
                    </div>
                    <button class="btn-delete" title="Eliminar"><i class="fa-solid fa-trash-can"></i></button>
                `;

                item.addEventListener('click', () => {
                    activeNoteId = note.id;
                    renderNotes();
                    loadActiveNote();
                    openEditorMobile();
                });

                item.querySelector('.btn-delete').addEventListener('click', (e) => deleteNote(note.id, e));
                notesList.appendChild(item);
            });
        }

        function updateActiveNote() {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (note) {
                note.title = noteTitle.value;
                note.content = noteContent.value;
                note.tag = noteTag.value;
                note.updatedAt = new Date().toISOString();

                notes = [note, ...notes.filter(n => n.id !== activeNoteId)];
                saveToStorage();
                renderNotes();
            }
        }

        function openEditorMobile() {
            appContainer.classList.add('mobile-editor-active');
        }

        function closeEditorMobile() {
            appContainer.classList.remove('mobile-editor-active');
        }

        backBtn.addEventListener('click', closeEditorMobile);

        document.getElementById('addChecklistBtn').addEventListener('click', () => {
            noteContent.value += "\n[ ] Tarea pendiente\n[x] Tarea completada\n";
            updateActiveNote();
        });

        lockNoteBtn.addEventListener('click', () => {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            if (note.pin) {
                if (confirm("¿Quieres quitar la protección por PIN de esta nota?")) {
                    note.pin = null;
                    saveToStorage();
                    loadActiveNote();
                    renderNotes();
                }
            } else {
                const newPin = prompt("Introduce un PIN de 4 dígitos para proteger esta nota:");
                if (newPin && newPin.length === 4 && !isNaN(newPin)) {
                    note.pin = newPin;
                    saveToStorage();
                    loadActiveNote();
                    renderNotes();
                } else if (newPin !== null) {
                    alert("El PIN debe tener exactamente 4 números.");
                }
            }
        });

        unlockBtn.addEventListener('click', () => {
            const note = notes.find(n => n.id === activeNoteId);
            if (note && pinInput.value === note.pin) {
                lockScreen.style.display = 'none';
            } else {
                alert("PIN Incorrecto");
                pinInput.value = '';
            }
        });

        document.getElementById('exportTxtBtn').addEventListener('click', () => {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;
            
            const blob = new Blob([`${note.title}\n\n${note.content}`], {type: 'text/plain;charset=utf-8'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${note.title || 'nota'}.txt`;
            a.click();
        });

        document.getElementById('exportAllBtn').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(notes, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup_libreta_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        });

        document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
        
        document.getElementById('importFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedNotes = JSON.parse(event.target.result);
                    if (Array.isArray(importedNotes)) {
                        notes = importedNotes;
                        saveToStorage();
                        activeNoteId = notes.length > 0 ? notes[0].id : null;
                        renderNotes();
                        loadActiveNote();
                        alert("¡Copia de seguridad restaurada!");
                    }
                } catch (err) {
                    alert("El archivo no es válido.");
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('tagFilters').addEventListener('click', (e) => {
            const chip = e.target.closest('.filter-chip');
            if (chip) {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                selectedTagFilter = chip.getAttribute('data-tag');
                renderNotes();
            }
        });

        newNoteBtn.addEventListener('click', createNote);
        noteTitle.addEventListener('input', updateActiveNote);
        noteContent.addEventListener('input', updateActiveNote);
        noteTag.addEventListener('change', updateActiveNote);
        searchInput.addEventListener('input', renderNotes);

        if (notes.length === 0) {
            createNote();
        } else {
            activeNoteId = notes[0].id;
            renderNotes();
            loadActiveNote();
        }
    </script>
</body>
</html>
